name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main, master]
  # 6 saatte bir ilanları tazeleyip siteyi yeniden yayınla
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: İlan verisini çek ve statik derleme üret
        # basePath depo adından otomatik türetilir (user.github.io depolarında boş kalır)
        run: bash scripts/build-pages.sh

      - name: Pages artefaktını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
